[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "henry-primme-sf-python"
version = "1.0.0"
authors = [
  { name="estrelaex" },
]
description = "SDK e Biblioteca Python nativa para comunicação TCP/IP com catracas e controladores de acesso Henry Primme SF (Catracas e Controladores de Acesso)."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
keywords = ["henry", "primme", "catraca", "controle-de-acesso", "tcp", "sockets"]

[project.scripts]
henry8x = "henry8x.cli:main"

[project.urls]
"Homepage" = "https://github.com/estrelanegrax/henry-primme-sf-python"
